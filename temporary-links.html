<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temporary Links</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1a1e27;--panel2:#222836;--line:#343c4d;--text:#edf1f8;--muted:#9ba7bb;--accent:#8b7cff;--green:#4ade80;--danger:#fb7185;--warn:#fbbf24}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0%,#292551 0,transparent 31%),radial-gradient(circle at 95% 12%,#153a4b 0,transparent 28%),linear-gradient(135deg,#10131a,#161c29);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:920px;margin:auto;padding:28px 18px 50px}header{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;margin-bottom:22px}h1{margin:0 0 4px;font-size:clamp(1.55rem,4vw,2.35rem);letter-spacing:-.04em}h1 span{color:var(--accent)}.sub{margin:0;color:var(--muted)}button,input,textarea,select{font:inherit}button{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);cursor:pointer;font-weight:650}button:hover{border-color:var(--accent)}button.primary{background:linear-gradient(135deg,var(--accent),#5c8df6);border-color:transparent;color:#fff;box-shadow:0 7px 18px #5e73ec55}button.danger{color:#fecdd3}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{padding:16px;border:1px solid color-mix(in srgb,var(--line) 90%,#fff 10%);border-radius:16px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 16px 44px #0004;backdrop-filter:blur(10px)}.panel h2{margin:0 0 12px;font-size:1rem}.add{display:grid;grid-template-columns:1fr auto;gap:9px}.add textarea{grid-column:1/-1;min-height:54px;resize:vertical}.field{width:100%;padding:10px;transition:border-color .16s,box-shadow .16s;border:1px solid var(--line);border-radius:9px;background:#10141d;color:var(--text)}.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #8b7cff2b}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spacer{flex:1}.count{padding:3px 8px;border:1px solid var(--line);border-radius:99px;background:#0f1420;color:var(--muted);font-size:.82rem}.list{display:grid;gap:9px;margin-top:13px}.card{padding:12px;border:1px solid var(--line);border-radius:11px;background:#121722}.card.done{opacity:.52}.title{display:block;overflow-wrap:anywhere;color:var(--text);text-decoration:none;font-weight:700}.local-title{display:block;overflow:hidden;color:var(--text);font-weight:700;text-overflow:ellipsis;white-space:nowrap}.domain{margin:4px 0 7px;color:var(--accent);font-size:.8rem}.local-path{overflow-wrap:anywhere;margin:4px 0 7px;color:var(--accent);font: .8rem ui-monospace,SFMono-Regular,Consolas,monospace}.note{overflow-wrap:anywhere;color:#c7d0df;font-size:.9rem;white-space:pre-wrap}.meta{color:var(--muted);font-size:.77rem}.actions{display:flex;gap:6px;margin-top:10px}.actions button{padding:6px 8px;font-size:.8rem}.empty{padding:25px 6px;color:var(--muted);text-align:center}.hint{margin:11px 0 0;color:var(--muted);font-size:.8rem;line-height:1.55}.shortcuts kbd{padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:#0d1119;color:#dce5f5}.notice{min-height:1.25em;margin:8px 0 0;color:var(--green);font-size:.86rem}.input-status{min-height:1.25em;margin:7px 0 -2px;color:var(--muted);font-size:.78rem}.input-status.ok{color:var(--green)}.toolbar{display:flex;align-items:center;gap:7px;margin:15px 0 -2px}.toolbar button{padding:5px 8px;font-size:.78rem}.toolbar button.active{border-color:var(--accent);color:var(--accent)}.card.expired{opacity:.64}.card .actions{align-items:center}.toast-pip{position:fixed;right:12px;bottom:12px;padding:7px 9px;border:1px solid var(--green);border-radius:8px;background:#173425;color:#d9ffe5;font-size:.78rem;box-shadow:0 4px 18px #0008}.pip-open{outline:2px solid var(--green);outline-offset:2px}@media(max-width:720px){header{flex-direction:column}.grid{grid-template-columns:1fr}.app{padding-top:18px}}body.pip{min-height:auto;background:var(--bg)}body.pip .app{max-width:none;padding:12px}body.pip header,body.pip .add-panel,body.pip .manage-panel{display:none}.pip-top{display:none}body.pip .pip-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.pip-card{display:flex;align-items:center;gap:7px;min-height:32px;padding:6px 8px}.pip-card .title,.pip-card .local-title{flex:1;min-width:0;overflow:hidden;font-size:.86rem;white-space:nowrap;text-overflow:ellipsis}.pip-card .actions{flex-wrap:nowrap;gap:4px;margin:0}.pip-card .actions button{padding:2px 6px;font-size:.78rem}

body.light{color-scheme:light;--bg:#f5f7fb;--panel:#ffffff;--panel2:#eef2f8;--line:#d5dcea;--text:#172033;--muted:#65728a;--accent:#2563eb;--green:#15803d;--danger:#be123c;--warn:#a16207;background:linear-gradient(135deg,#f8fafc,#e9eef8)}
body.light .field{background:#fff}body.light .card{background:#fff}body.light .count{background:#f5f7fb}body.light .shortcuts kbd{background:#edf2f7}body.light .local-path{color:#2563eb}
.theme-toggle{min-width:42px;padding:9px 10px}
.pip-add{display:grid;grid-template-columns:1fr auto;gap:6px;margin:0 0 10px}.pip-add input{min-width:0;padding:8px;font-size:.82rem}.pip-add button{padding:7px 9px;font-size:.8rem}
.add-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.add-head h2{margin:0}.add-head .badge{color:#c9c1ff;background:#8b7cff20;border:1px solid #8b7cff45;border-radius:99px;padding:3px 8px;font-size:.72rem;font-weight:700}.url-row{display:grid;grid-template-columns:1fr auto;gap:9px}.paste-btn{white-space:nowrap}.add-cta{min-height:43px}.kind-icon{font-size:1rem}.recent-label{font-size:.76rem;color:var(--muted);margin:10px 0 -3px}.keyboard-hint{font-size:.75rem;color:var(--muted)}body.light .add-head .badge{color:#5140b5;background:#e9e6ff}

/* Layout refinement */
header{align-items:center;padding:8px 0 18px;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
header .row{margin-left:auto}.grid{grid-template-columns:minmax(0,1.35fr) minmax(290px,.65fr);align-items:stretch}.add-panel{padding:18px}.manage-panel{display:flex;flex-direction:column;justify-content:space-between}.manage-panel h2{margin-bottom:16px}.manage-panel .row{gap:8px}.manage-panel .hint{margin-top:auto;padding-top:16px}.add{grid-template-columns:minmax(0,1fr) 148px}.add .url-row{grid-column:1/-1}.add textarea{min-height:48px}.add-cta{min-width:148px}.toolbar{padding:8px 0 2px;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}.toolbar .spacer{min-width:8px}.list{margin-top:14px}.panel:has(#list){padding:18px}.panel:has(#list)>.row{padding-bottom:4px}.card{transition:transform .15s,border-color .15s,box-shadow .15s}.card:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 8px 22px #0002}.actions{padding-top:2px}.actions button{white-space:nowrap}@media(max-width:720px){header{align-items:flex-start}.grid{grid-template-columns:1fr}.manage-panel{gap:18px}.add{grid-template-columns:1fr auto}.add-cta{min-width:0}.toolbar{gap:5px}.toolbar button{padding:5px 7px}.toolbar #purgeExpired{margin-top:2px;width:100%}}

/* Balanced composition: the control panel keeps its natural height instead of stretching */
.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start;gap:18px}
.add-panel{padding:20px}.manage-panel{display:block;padding:20px;align-self:start}
.manage-panel h2{margin:0 0 14px}.manage-panel .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.manage-panel #exportBtn{grid-column:1/-1}.manage-panel .hint{margin:13px 0 0;padding:11px 0 0;border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.add{grid-template-columns:minmax(0,1fr) 152px;gap:10px}.add .url-row{grid-column:1/-1}.add textarea{min-height:52px}.add-cta{min-width:152px}
.panel:has(#list){margin-top:18px!important;padding:20px}.panel:has(#list)>.row{min-height:28px}.toolbar{margin-top:12px;padding:10px 0 4px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.manage-panel .row{display:flex;flex-wrap:wrap}.manage-panel #exportBtn{flex-basis:auto}.manage-panel .hint{display:none}.add{grid-template-columns:1fr auto}.add-cta{min-width:0}}

/* Compact finish panel: remove the visual dead space under its actions */
.manage-panel{height:auto!important;min-height:0!important;align-self:start!important}
.manage-panel .row{margin:0}.manage-panel .hint{display:none}
@media(min-width:761px){.grid{align-items:start}.manage-panel{padding-bottom:19px}}

/* Compact the add panel so the next section does not leave a large empty right-hand area */
.add-panel #inputStatus{display:none}.add-panel .hint{display:none}.add-panel .notice{margin:6px 0 0;min-height:0}.add-panel .add textarea{min-height:40px}.add-panel{padding-bottom:14px}.add-head{margin-bottom:9px}
</style>
</head>
<body>
<main class="app"><header><div><h1>Temporary <span>Links</span></h1><p class="sub">Save links and file paths for just as long as you need them.</p></div><div class="row"><button id="themeBtn" class="theme-toggle" title="Switch to light mode">☀</button><button id="pipBtn" class="primary">↗ Open floating window</button><span id="support" class="count"></span></div></header>
<section class="grid"><div class="panel add-panel"><div class="add-head"><h2>Quick add</h2><span class="badge">Temporary links</span></div><div class="add"><div class="url-row"><input id="url" class="field" placeholder="Paste a URL or file path" autocomplete="off"><button id="pasteBtn" class="paste-btn" title="Paste clipboard content into the input field only">📋 Paste</button></div><textarea id="note" class="field" placeholder="Note (optional)"></textarea><select id="ttl" class="field"><option value="session">This session</option><option value="today">Until today</option><option value="3d">3 days</option><option value="7d">7 days</option><option value="keep">Keep until removed</option></select><button id="addBtn" class="primary add-cta">＋ Add</button></div><p id="inputStatus" class="input-status">Paste a URL or Windows file path</p><p id="notice" class="notice"></p><p class="hint"><b>📋 Paste</b> only fills the input. <b>＋ Add</b> saves it.<span class="keyboard-hint"> Press Enter to add</span></p></div><div class="panel manage-panel"><h2>Wrap up</h2><div class="row"><button id="exportBtn">Export Markdown</button><button id="clearDoneBtn">Clear done</button><button id="clearAllBtn" class="danger">Clear all</button></div></div></section>
<section class="panel" style="margin-top:16px"><div class="pip-top"><strong>Temporary Links</strong><span class="spacer"></span><span id="pipCount" class="count"></span></div><div class="row"><h2 style="margin:0">On the shelf</h2><span class="spacer"></span><span id="count" class="count"></span></div><div class="toolbar" id="toolbar"><button data-filter="active" class="active">Active</button><button data-filter="all">All</button><button data-filter="done">Done</button><span class="spacer"></span><button id="purgeExpired" title="Remove expired links only">Clear expired</button></div><div id="list" class="list"></div></section></main>
<script>
(() => {
const KEY='temporary-links-v1', THEME_KEY='temporary-links-theme'; let links=load(); let pipWin=null; let filter='active'; let theme=localStorage.getItem(THEME_KEY)||'dark';
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}
function classify(v){v=v.trim();if(/^https?:\/\//i.test(v))return'web';if(/^file:\/\//i.test(v))return'file';if(/^[a-z]:[\\/]/i.test(v)||/^\\\\/.test(v))return'path';return null}
function localPath(v){const kind=classify(v);if(kind==='path')return v;if(kind!=='file')return'';try{const u=new URL(v),p=decodeURIComponent(u.pathname);return u.host?`\\${u.host}${p.replace(/\//g,'\\')}`:p.replace(/^\/([a-z]:\/)/i,'$1').replace(/\//g,'\\')}catch{return v}}
function domain(v){try{return new URL(v).hostname.replace(/^www\./,'')}catch{return v}}
function titleFor(v){if(classify(v)==='web')return domain(v);return localPath(v).split(/[\\/]/).filter(Boolean).pop()||'Local file'}
function parentPath(v){const p=localPath(v),a=p.split(/[\\/]/);a.pop();return /^[a-z]:$/i.test(a[0])?a[0]+'\\'+a.slice(1).join('\\'):a.join('\\')}
function expiry(v){const d=new Date();if(v==='session')return'session';if(v==='keep')return null;d.setHours(23,59,59,999);if(v==='3d')d.setDate(d.getDate()+3);if(v==='7d')d.setDate(d.getDate()+7);return d.toISOString()}
function expired(x){return x.expiresAt&&x.expiresAt!=='session'&&Date.now()>Date.parse(x.expiresAt)}
function time(x){if(!x.expiresAt)return'Keep until removed';if(x.expiresAt==='session')return'This session';return 'Expires: '+new Date(x.expiresAt).toLocaleDateString('ja-JP')}
function active(){return links.filter(x=>!x.done&&!expired(x))}
function card(x,compact=false){const kind=x.kind||classify(x.url),local=kind==='file'||kind==='path',title=x.title||titleFor(x.url),path=localPath(x.url);if(compact)return `<article class="card pip-card ${x.done?'done':''}" data-id="${x.id}">${local?`<span class="local-title" title="${esc(path)}">${esc(title)}</span>`:`<a class="title" href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(x.url)}">${esc(title)}</a>`}<div class="actions">${local?'<button class="copy-path" title="Copy path">Copy</button>':''}<button class="done" title="Done">✓</button><button class="delete danger" title="Remove">×</button></div></article>`;return `<article class="card ${x.done?'done':''}" data-id="${x.id}">${local?`<span class="local-title" title="${esc(path)}">${esc(title)}</span>`:`<a class="title" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(title)}</a>`}<div class="${local?'local-path':'domain'}">${esc(local?path:domain(x.url))}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="row" style="margin-top:8px"><span class="meta">${time(x)}</span>${expired(x)?'<span class="meta" style="color:var(--warn)">Expired</span>':''}</div><div class="actions">${local?'<button class="copy-path">Copy path</button><button class="copy-parent">Copy folder</button><button class="copy-name">Copy name</button>':'<button class="open">Open</button>'}<button class="done">${x.done?'Restore':'✓ Done'}</button><button class="delete danger">× Remove</button></div></article>`}
function render(){const all=[...links].sort((x,y)=>(x.done-y.done)||(y.createdAt-x.createdAt));const a=filter==='active'?all.filter(x=>!x.done&&!expired(x)):filter==='done'?all.filter(x=>x.done):all;$('#list').innerHTML=a.length?a.map(x=>card(x)).join(''):`<div class="empty">${filter==='active'?'No active links.':'Nothing in this view.'}</div>`;$('#count').textContent=active().length+' links';document.querySelectorAll('#toolbar [data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
function syncPip(){const w=pipWin;if(!w||w.closed)return;const list=w.document.querySelector('#list'),count=w.document.querySelector('#pipCount');if(!list||!count)return;const a=active();count.textContent=a.length+' links';list.innerHTML=a.length?a.map(x=>card(x,true)).join(''):'<div class="empty">Your shelf is empty</div>'}
function save(){localStorage.setItem(KEY,JSON.stringify(links));render();syncPip()}
function notice(t,err=false){const n=$('#notice');if(n){n.textContent=t;n.style.color=err?'var(--danger)':'var(--green)';setTimeout(()=>{if(n.textContent===t)n.textContent=''},1800)}const w=pipWin;if(w&&!w.closed){let toast=w.document.querySelector('.toast-pip');if(!toast){toast=w.document.createElement('div');toast.className='toast-pip';w.document.body.append(toast)}toast.textContent=t;setTimeout(()=>toast?.remove(),1400)}}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);notice(msg)}catch{const e=document.createElement('textarea');e.value=t;e.style.cssText='position:fixed;opacity:0';document.body.append(e);e.select();const ok=document.execCommand('copy');e.remove();notice(ok?msg:'Could not copy',!ok)}}
function bind(doc){if(doc.__bound)return;doc.__bound=true;doc.addEventListener('click',async e=>{const a=e.target.closest('button,a'),c=a?.closest('.card');if(!a||!c)return;const x=links.find(z=>z.id===c.dataset.id);if(!x)return;if(a.classList.contains('done')){e.preventDefault();x.done=!x.done;save();return}if(a.classList.contains('delete')){e.preventDefault();links=links.filter(z=>z.id!==x.id);save();return}if(a.classList.contains('copy-path')){e.preventDefault();await copyText(localPath(x.url),'Copy pathしました');return}if(a.classList.contains('copy-parent')){e.preventDefault();await copyText(parentPath(x.url),'Copy folderしました');return}if(a.classList.contains('copy-name')){e.preventDefault();await copyText(x.title||titleFor(x.url),'Copy nameしました');return}if(a.classList.contains('open')){e.preventDefault();window.open(x.url,'_blank','noopener')}})}
function addFrom(doc){const input=doc.querySelector(doc===document?'#url':'#pipUrl'),url=input.value.trim(),kind=classify(url);if(!kind){notice('Enter an http(s) URL or a local path',true);return}if(links.some(x=>x.url===url&&!x.done)){notice('Already on the shelf');return}const note=doc===document?$('#note').value.trim():'';const expiresAt=doc===document?expiry($('#ttl').value):expiry('session');links.unshift({id:crypto.randomUUID(),url,kind,note,title:titleFor(url),expiresAt,done:false,createdAt:Date.now()});input.value='';if(doc===document){$('#note').value='';filter='active';updateInputStatus()}save();notice('Added to shelf')}
function add(){addFrom(document)}
function applyTheme(){document.body.classList.toggle('light',theme==='light');$('#themeBtn').textContent=theme==='light'?'☾':'☀';$('#themeBtn').title=theme==='light'?'Switch to dark mode':'Switch to light mode';if(pipWin&&!pipWin.closed){pipWin.document.body.classList.toggle('light',theme==='light');const b=pipWin.document.querySelector('#pipThemeBtn');if(b)b.textContent=theme==='light'?'☾':'☀'}}
function toggleTheme(){theme=theme==='light'?'dark':'light';localStorage.setItem(THEME_KEY,theme);applyTheme()}
function pasted(e){const d=e.clipboardData,html=d?.getData('text/html');if(html){const a=new DOMParser().parseFromString(html,'text/html').querySelector('a[href]');if(a&&classify(a.href)==='web'){e.preventDefault();$('#url').value=a.href;$('#url').dataset.title=a.textContent.trim();notice('Link title detected');return}}const t=d?.getData('text/plain').trim();if(classify(t)){e.preventDefault();$('#url').value=t;delete $('#url').dataset.title;notice('Pasted into the input field。Choose Add to save it')}}
function updateInputStatus(){const v=$('#url').value.trim(),k=classify(v),status=$('#inputStatus');if(!v){status.textContent='Paste a URL or Windows file path';status.className='input-status';return}if(k==='web'){status.textContent='Will be added as a web link';status.className='input-status ok';return}if(k==='file'||k==='path'){status.textContent='Will be added as a local path（Copy）';status.className='input-status ok';return}status.textContent='Use http(s), file:///, C:\..., or \\server\share';status.className='input-status'}
$('#toolbar').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;render()});
$('#purgeExpired').onclick=()=>{const n=links.filter(expired).length;if(!n){notice('No expired links');return}if(confirm(`Clear ${n} expired link(s)?`)){links=links.filter(x=>!expired(x));save();notice('Expired links cleared')}};
$('#url').addEventListener('input',updateInputStatus);
$('#addBtn').onclick=add;$('#url').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};$('#url').onpaste=pasted;$('#pasteBtn').onclick=async()=>{try{$('#url').value=(await navigator.clipboard.readText()).trim();delete $('#url').dataset.title;$('#url').focus();updateInputStatus();notice('Pasted into the input field。Choose Add to save it')}catch{notice('Paste directly into the field',true)}};$('#clearDoneBtn').onclick=()=>{links=links.filter(x=>!x.done);save()};$('#clearAllBtn').onclick=()=>{if(confirm('Alllinks and saved data?')){links=[];localStorage.removeItem(KEY);render();syncPip();notice('All捨てました')}};$('#exportBtn').onclick=()=>{const md=links.map(x=>`- [${x.title||titleFor(x.url)}](${x.url})${x.note?' — '+x.note:''}${x.done?' _(Done)_':''}`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md||'# Temporary Links\n'],{type:'text/markdown'}));a.download='temporary-links-'+new Date().toISOString().slice(0,10)+'.md';a.click();URL.revokeObjectURL(a.href)};
async function openPip(){
  if(!('documentPictureInPicture'in window)){notice('Floating window is not supported in this browser',true);return}
  if(pipWin&&!pipWin.closed){pipWin.focus();return}
  try{
    pipWin=await documentPictureInPicture.requestWindow({width:390,height:520});
    document.querySelectorAll('style').forEach(n=>pipWin.document.head.append(n.cloneNode(true)));
    pipWin.document.body.className='pip '+(theme==='light'?'light':'');
    pipWin.document.body.innerHTML='<main class="app"><section class="panel"><div class="pip-top"><strong>Temporary Links</strong><span class="spacer"></span><button id="pipThemeBtn" class="theme-toggle" title="Toggle theme">☀</button><span id="pipCount" class="count"></span></div><div class="pip-add"><input id="pipUrl" class="field" placeholder="Paste URL / path"><button id="pipAddBtn" class="primary">＋ Add</button></div><div id="list" class="list"></div></section></main>';
    bind(pipWin.document);
    const addPip=()=>addFrom(pipWin.document);
    pipWin.document.querySelector('#pipAddBtn').onclick=addPip;
    pipWin.document.querySelector('#pipUrl').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addPip()}};
    pipWin.document.querySelector('#pipThemeBtn').onclick=toggleTheme;
    pipWin.addEventListener('pagehide',()=>{pipWin=null;$('#pipBtn').classList.remove('pip-open');$('#pipBtn').textContent='↗ Open floating window'});
    $('#pipBtn').classList.add('pip-open');$('#pipBtn').textContent='● Floating window is open';syncPip()
  }catch{notice('Could not open floating window',true)}
}
$('#themeBtn').onclick=toggleTheme;applyTheme();$('#pipBtn').onclick=openPip;$('#support').textContent=('documentPictureInPicture'in window)?'Floating window ready':'Standard mode';bind(document);window.addEventListener('beforeunload',()=>{links=links.filter(x=>x.expiresAt!=='session');localStorage.setItem(KEY,JSON.stringify(links))});render();
})();
</script></body></html>
