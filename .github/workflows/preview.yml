# PR source code must never run on the credential-bearing runner.
name: Deploy PR preview
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Test reference behavior
      run: node --test
    - name: Validate and stage static app
      shell: pwsh
      run: |
        if (!(Test-Path -LiteralPath "./index.html")) { throw "index.html is missing" }
        if (!(Test-Path -LiteralPath "./temporary-links.html")) { throw "temporary-links.html is missing" }

        $html = Get-Content -Raw -Encoding UTF8 "./temporary-links.html"
        if ($html -notmatch "connect-src 'none'") { throw "runtime network-blocking CSP is missing" }
        if ($html -match '<script[^>]+src=["'']https?://') { throw "external runtime script source detected" }

        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "./preview-dist"
        New-Item -ItemType Directory -Force -Path "./preview-dist" | Out-Null
        Copy-Item -LiteralPath "./index.html" -Destination "./preview-dist/index.html"
        Copy-Item -LiteralPath "./temporary-links.html" -Destination "./preview-dist/temporary-links.html"
        Write-Host "Staged Temporary Links static preview."
    - name: Upload static preview site
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-preview-site
        path: preview-dist/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        include-hidden-files: true
    permissions:
      contents: read
